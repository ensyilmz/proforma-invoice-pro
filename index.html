<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proforma Studio</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script></head><body><div id="status" class="toast" role="status"></div><header class="top"><div><b>PROFORMA <span>STUDIO</span></b><small>Teklif çalışma alanı</small></div><nav><button id="new">＋ Yeni Oluştur</button><button id="history">Geçmiş Teklifler</button><button id="company">Firma Ayarları</button><button id="save" class="primary">Kaydet</button><button id="pdf" class="dark">PDF İndir</button><button id="logout" aria-label="Çıkış yap">Çıkış</button></nav></header><main><section class="editor"><div class="editor-title"><div><small>AKTİF TEKLİF</small><h1 id="title">Yükleniyor…</h1></div><span id="saveStatus">Yerel taslak</span></div><div class="card"><h2>Teklif bilgileri</h2><div id="basic" class="fields"></div></div><div class="card"><h2>Alıcı bilgileri</h2><label>Firma / kişi, adres ve iletişim<textarea id="buyerInfo" rows="4"></textarea></label><details><summary>Bu teklifin satıcı bilgileri</summary><label>Satıcı<textarea id="sellerInfo" rows="4"></textarea></label></details></div><div class="card"><div class="row"><h2>Ürünler</h2><button id="add">＋ Ürün Ekle</button></div><div id="products"></div></div><div class="card"><h2>Fiyat ve teslimat</h2><div id="commercial" class="fields"></div><div id="liveTotal" class="live-total"></div></div><div class="card"><h2>Şartlar ve belge alanları</h2><div id="terms" class="fields"></div><label>Genel bilgilendirme<textarea id="notesText" rows="5"></textarea></label><div id="toggles" class="checks"></div></div></section><section class="preview"><div class="preview-heading"><span>A4 · Belge önizlemesi</span><span id="pageCount"></span></div><div id="pages"></div></section></main><dialog id="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button id="closeModal">Kapat</button></div><div id="modalBody"></div></dialog><script type="module" src="script.js"></script></body></html>
